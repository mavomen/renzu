# Docker Compose for the F-003 local observability environment.
# Scope: OpenTelemetry Collector + Jaeger only (M1 slice). No application
# services yet; the first Rust crate lands in F-004.
#
# All published ports are bound to 127.0.0.1 only (PRD NFR-04).
# Image tags are pinned explicitly (no :latest) (PRD NFR-01).
#
# Validate without Docker:  docker compose config
# Start:                    docker compose up -d
# Stop:                     docker compose down

services:
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    container_name: renzu-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger query UI
    # OTLP ports (4317 gRPC, 4318 HTTP) and the Jaeger collector port (14250)
    # are consumed by the otel-collector over the Docker network; they are not
    # published to the host to keep the host surface minimal.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector:0.113.0
    container_name: renzu-otel-collector
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_healthy
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    # NOTE: the otel/opentelemetry-collector image is distroless and ships no
    # shell or probe tools (nc/curl/wget), so an internal port probe is not
    # possible here. Readiness is verified externally by connecting to port
    # 4317 from the host (see docs/runbooks/local-infrastructure.md).
    # Startup ordering is still enforced: the Collector waits for Jaeger to
    # report healthy via depends_on condition: service_healthy.
