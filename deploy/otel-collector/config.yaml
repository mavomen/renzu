# OpenTelemetry Collector configuration for F-003 (local infrastructure).
# Minimal M1 pipeline: OTLP receiver -> Jaeger exporter (traces only).
# The Collector binds OTLP on 0.0.0.0 so the application (on another container
# or host) can reach it; published ports are mapped to 127.0.0.1 in compose.yaml.
#
# Note: the `jaeger` exporter was removed from the OTel Collector in recent
# versions; the `otlphttp` exporter is used instead, targeting Jaeger's OTLP
# HTTP receiver (jaeger:4318). Jaeger all-in-one accepts OTLP on 4317/4318.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp:
    endpoint: http://jaeger:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
