apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: renzu-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    uid: renzu-loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        # Application OTLP log lines carry a native trace ID as `traceid`.
        # The link target is the Tempo data source's internal trace-ID query.
        - datasourceUid: renzu-tempo
          matcherRegex: '"traceid":"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'
          urlDisplayLabel: View Tempo trace
  - name: Tempo
    type: tempo
    uid: renzu-tempo
    access: proxy
    url: http://tempo:3200
    editable: true
